# Locate the REMAINING ARM64 failure, after clang-built Qt fixed the first one.
#
# History, all measured on this runner (real ARM64 hardware):
#   1. Qt built with MSVC cl.exe  -> Skipper died instantly with 0xC0000005 inside
#      Qt5Core!QObjectPrivate::addConnection, printing nothing at all. The MSVC ARM64 optimizer
#      miscompiles Qt (QTBUG-101473); -O1 was not enough, only /Od worked.
#   2. Qt rebuilt with clang-cl   -> Skipper now prints its banner, loads Qt 5.15.19 and reaches
#      "Initialization of application context". So Qt is fixed. What is left is a DIFFERENT fault,
#      further along, in code still compiled by MSVC (Skipper itself, the ax* libs, vcpkg libs).
#
# The two surviving symptoms need two different probes, which is what this workflow runs:
#   -version    HANGS  -> start it, let it wedge, then attach and print every thread's stack
#   -self-check CRASHES-> run it under cdb from the start and print the faulting stack
name: skipper-arm-win-crash

on:
  workflow_dispatch:
    inputs:
      version:
        description: Skipper version to test
        required: true
        default: "3.5.1.1884"
      tag:
        description: Release tag in THIS repository holding the ARM installer and symbols
        required: true
        default: "arm-test-3.5.1.1884"

jobs:
  crash:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: Install the package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          curl.exe -L -f -o installer.exe "$base/Skipper-$env:VERSION-Windows-all-arm-64bit.exe"
          if ($LASTEXITCODE -ne 0) { throw "installer download failed" }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'Installed'
          $p = Start-Process -FilePath .\installer.exe -ArgumentList "/S","/INSTDIR=$dir" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "installer hung" }
          if (-not (Test-Path (Join-Path $dir 'Skipper.exe'))) { throw "Skipper.exe not installed" }
          "installed OK"

      - name: Fetch symbols
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          curl.exe -L -f -o symbols.zip "$base/symbols-pdb-arm-64-all.zip"
          if ($LASTEXITCODE -ne 0) { throw "symbol download failed" }
          Expand-Archive symbols.zip -DestinationPath symbols -Force
          Get-ChildItem symbols -Recurse -Filter *.pdb | ForEach-Object { "  {0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - name: Locate a debugger
        id: dbg
        shell: pwsh
        run: |
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers','C:\Program Files\Windows Kits\10\Debuggers' `
                   -Recurse -Filter cdb.exe -EA SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { throw "cdb not present on this image" }
          "found: $($cdb.FullName)"
          "cdb=$($cdb.FullName)" | Out-File -Append $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------- the HANG ------------
      # This one runs FIRST because it cannot wedge: the process runs WITHOUT a debugger and is
      # attached to only after a fixed wait, so the step always terminates and always yields data.
      - name: Stack of the -version hang
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # -version wedges AFTER printing the banner, so there is no exception to catch. Start it
          # normally, give it long enough to reach the stuck state, then attach and ask every thread
          # where it is. A hang shows up as one thread parked in a wait while nothing progresses.
          $exe = Join-Path $env:GITHUB_WORKSPACE 'Installed\Skipper.exe'
          $syms = "$env:GITHUB_WORKSPACE\symbols;$env:GITHUB_WORKSPACE\Installed"
          $p = Start-Process -FilePath $exe -ArgumentList '-version' -PassThru `
                 -RedirectStandardOutput version-out.txt -RedirectStandardError version-err.txt
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            "process already exited with $($p.ExitCode) - no hang to attach to"
          } else {
            "still running as pid $($p.Id), attaching"
            # !locks/!cs need the CRT lock lists, which are not always there; the thread stacks are
            # the part that always works, so they come first and the rest is best effort.
            & "${{ steps.dbg.outputs.cdb }}" -p $p.Id -y $syms -c '.reload /f; ~*kb 40; !locks; q' 2>&1 |
              Tee-Object -FilePath cdb-hang.log
            if (-not $p.HasExited) { $p.Kill() }
          }
          "--- stdout so far ---"
          Get-Content version-out.txt -EA SilentlyContinue
          "--- stderr so far ---"
          Get-Content version-err.txt -EA SilentlyContinue

      # ---------------------------------------------------------------- readable summary ----
      - name: Key frames
        if: always()
        shell: pwsh
        run: |
          function Show($file, $title) {
            if (-not (Test-Path $file)) { "no $file"; return }
            "";  "===== $title ====="
            # Our own frames are what identifies the culprit module; the exception header gives the
            # address and code. Everything else in a cdb log is noise for this purpose.
            Select-String -Path $file -Pattern 'ExceptionAddress|ExceptionCode|FAULTING_IP|MODULE_NAME|IMAGE_NAME|SYMBOL_NAME|STACK_COMMAND|Skipper!|ax[A-Z]|Qt5|Qtitan|libcrypto|libssl|libmysql|libpq|breakpad|ntdll!Nt|KERNELBASE!' |
              Select-Object -First 80 | ForEach-Object { $_.Line.Trim() }
          }
          Show 'cdb-selfcheck.log' 'CRASH  (-self-check)'
          Show 'cdb-hang.log'      'HANG   (-version)'

      - name: Collect everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skipper-arm-crash
          path: |
            cdb-selfcheck.log
            cdb-hang.log
            version-out.txt
            version-err.txt
          if-no-files-found: ignore

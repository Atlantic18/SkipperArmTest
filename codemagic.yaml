# Codemagic trigger repo for testing Skipper on a real Apple Silicon Mac over VNC.
# Two workflows:
#   vnc-smoke-test    - Phase 0: just boot a Mac and keep it alive to verify VNC works.
#   skipper-arm-smoke - Phase 1: download the Universal 2 Skipper DMG, mount it, verify the
#                       arm64 slice + signature, then keep the machine alive so you can launch
#                       Skipper.app over VNC and check native arm64 launch + license + import/export.
#
# Run manually with "Enable SSH/VNC access" ticked, then connect with RealVNC Viewer.

workflows:
  vnc-smoke-test:
    name: VNC smoke test (M2)
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Keep machine alive for VNC
        script: |
          echo "=== macOS build machine is up ==="
          sw_vers
          echo "Architecture: $(uname -m)   # arm64 = real Apple Silicon"
          sleep 3000

  skipper-arm-smoke:
    name: Skipper Universal 2 arm64 smoke test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        # Two knobs for a new release: SKIPPER_VERSION (every release) and SKIPPER_MAC_LABEL
        # (only when the Jenkins macOS build agent's OS changes — it is baked into the asset name).
        # The DMG is fetched by its direct release URL; the GitHub API is intentionally NOT used —
        # its unauthenticated rate limit is exhausted on Codemagic's shared IPs.
        #
        # The label carries the architecture since 3.5.1.1883: release artifacts are named
        # Skipper-<version>-<OS>-<osversion>-<arch>-<bits>bit.<ext>, and the macOS build is a
        # Universal 2 binary, hence "universal". Releases up to 3.5.1.1882 have no arch segment
        # ("MacOS-15.7-64bit"), so pinning an older version needs the old label too.
        SKIPPER_VERSION: "3.5.1.1883"
        SKIPPER_MAC_LABEL: "MacOS-15.7-universal-64bit"
    scripts:
      - name: Download, mount and verify the universal Skipper
        script: |
          set -e
          cd ~
          echo "=== machine ==="; uname -m; sw_vers -productVersion
          SKIPPER_DMG_URL="https://github.com/Atlantic18/Skipper/releases/download/${SKIPPER_VERSION}/Skipper-${SKIPPER_VERSION}-${SKIPPER_MAC_LABEL}.dmg"
          echo "=== download $SKIPPER_DMG_URL ==="
          curl -L -f -o skipper.dmg "$SKIPPER_DMG_URL"
          ls -lh skipper.dmg
          echo "=== mount ==="
          hdiutil attach skipper.dmg -mountpoint /Volumes/SkipperMount -nobrowse
          APP=$(find /Volumes/SkipperMount -maxdepth 1 -name 'Skipper.app' | head -1)
          echo "App in DMG: $APP"
          cp -R "$APP" ~/Desktop/Skipper.app
          hdiutil detach /Volumes/SkipperMount
          BIN=~/Desktop/Skipper.app/Contents/MacOS/Skipper
          echo "=== architectures ==="; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64 && echo "ARM64 SLICE PRESENT" || { echo "NO ARM64 SLICE"; exit 1; }
          echo "=== code signature ==="; codesign -dvv ~/Desktop/Skipper.app 2>&1 | head -6 || true
          echo "=== gatekeeper assessment ==="; spctl -a -vvv -t exec ~/Desktop/Skipper.app 2>&1 | head -4 || true
      - name: Keep machine alive for VNC
        script: |
          echo "Skipper.app is on the Desktop."
          echo "Connect via VNC, launch it, then verify:"
          echo "  1) Activity Monitor -> Kind = 'Apple' (native arm64, not 'Intel'/Rosetta)"
          echo "  2) license dialog appears (GUI runs)"
          echo "  3) import a test model, export, inspect the output"
          sleep 3200

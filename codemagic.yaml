# Codemagic — Phase 0: verify that an Apple Silicon Mac boots and is reachable via VNC.
#
# Usage:
#   1) In Codemagic, start the "vnc-smoke-test" workflow MANUALLY (Start new build).
#   2) Once the build is running, expand the panel above the steps:
#      "Explore build machine via SSH or VNC/RDP client".
#   3) Connect with RealVNC Viewer to Host:Port + the shown password -> you get the macOS desktop.
#   4) The 'sleep' keeps the machine alive for ~50 min; cancel the build when done.

workflows:
  vnc-smoke-test:
    name: VNC smoke test (M2)
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Keep machine alive for VNC
        script: |
          echo "=== macOS build machine is up ==="
          sw_vers
          echo "Architecture: $(uname -m)   # arm64 = real Apple Silicon"
          echo "Connect via the 'Explore build machine via SSH or VNC/RDP client' panel above the steps."
          echo "The machine will stay up for ~50 minutes, then the build ends by itself."
          sleep 3000
